<div class="ward-modal-backdrop" *ngIf="open" (click)="close()">
  <div class="ward-modal" (click)="$event.stopPropagation()">
    <div class="ward-modal__head">
      <div>
        <h3>{{ title }}</h3>
        <p *ngIf="loading">Loading options...</p>
      </div>
      <button type="button" class="ward-modal__close" (click)="close()"><i class="fa fa-times"></i></button>
    </div>

    <div class="ward-modal__body" [ngSwitch]="moduleKey">
      <ng-container *ngSwitchCase="'admissions'">
        <label><span>Patient</span><select [(ngModel)]="form['patientId']"><option value="">Select patient</option><option *ngFor="let patient of patients" [value]="patient._id">{{ patientLabel(patient) }}</option></select></label>
        <label><span>Room</span><select [(ngModel)]="form['roomId']"><option value="">Select room</option><option *ngFor="let room of rooms" [value]="room._id">{{ roomLabel(room) }}</option></select></label>
        <label><span>Consultant Doctor</span><select [(ngModel)]="form['consultantDoctorId']"><option value="">Select doctor</option><option *ngFor="let doctor of doctors" [value]="doctor._id">{{ doctorLabel(doctor) }}</option></select></label>
        <label><span>Bed Label</span><input [(ngModel)]="form['bedLabel']" placeholder="A-1" /></label>
        <label><span>Admission Reason</span><textarea [(ngModel)]="form['admissionReason']" rows="2"></textarea></label>
      </ng-container>

      <ng-container *ngSwitchCase="'nursing-care'">
        <label><span>Patient</span><select [(ngModel)]="form['patientId']"><option value="">Select patient</option><option *ngFor="let patient of patients" [value]="patient._id">{{ patientLabel(patient) }}</option></select></label>
        <label><span>Note Type</span><select [(ngModel)]="form['noteType']"><option value="routine">Routine</option><option value="assessment">Assessment</option><option value="intervention">Intervention</option><option value="progress">Progress</option><option value="incident">Incident</option><option value="escalation">Escalation</option><option value="wound">Wound</option><option value="pain">Pain</option><option value="care_plan">Care Plan</option></select></label>
        <label><span>Task / Problem</span><input [(ngModel)]="form['title']" placeholder="Wound dressing" /></label>
        <label><span>Priority</span><select [(ngModel)]="form['priority']"><option value="normal">Routine</option><option value="urgent">Urgent</option><option value="stat">STAT</option><option value="high">High</option><option value="critical">Critical</option></select></label>
        <label><span>Shift</span><select [(ngModel)]="form['shift']"><option *ngFor="let shift of shiftOptions" [value]="shift.value">{{ shift.label }}</option></select></label>
        <label><span>Observation / Notes</span><textarea [(ngModel)]="form['description']" rows="3"></textarea></label>
      </ng-container>

      <ng-container *ngSwitchCase="'mar'">
        <label><span>Patient</span><select [(ngModel)]="form['patientId']"><option value="">Select patient</option><option *ngFor="let patient of patients" [value]="patient._id">{{ patientLabel(patient) }}</option></select></label>
        <label><span>Medicine</span><input [(ngModel)]="form['medicineName']" /></label>
        <label><span>Dose</span><input [(ngModel)]="form['dose']" /></label>
        <label><span>Route</span><input [(ngModel)]="form['route']" /></label>
        <label><span>Status</span><select [(ngModel)]="form['marStatus']"><option value="given">Given</option><option value="late">Late</option><option value="held">Held</option><option value="refused">Refused</option><option value="missed">Missed</option><option value="not_available">Not available</option></select></label>
        <label><span>Notes / Reason</span><textarea [(ngModel)]="form['notes']" rows="2" placeholder="Required when held, refused, missed, or unavailable"></textarea></label>
      </ng-container>

      <ng-container *ngSwitchCase="'drips-iv'">
        <label><span>Prescription</span><select [(ngModel)]="form['prescriptionId']"><option value="">Select prescription</option><option *ngFor="let rx of prescriptions" [value]="rx._id">Rx {{ rx._id.slice(-6) }} · {{ rx.patient?.firstName }} {{ rx.patient?.lastName }}</option></select></label>
        <label><span>Fluid Name</span><input [(ngModel)]="form['fluidName']" placeholder="Normal Saline" /></label>
        <label><span>Notes</span><textarea [(ngModel)]="form['notes']" rows="2"></textarea></label>
      </ng-container>

      <ng-container *ngSwitchCase="'vitals'">
        <label><span>Patient</span><select [(ngModel)]="form['patientId']"><option value="">Select patient</option><option *ngFor="let patient of patients" [value]="patient._id">{{ patientLabel(patient) }}</option></select></label>
        <div class="ward-modal__grid">
          <label><span>BP</span><input [(ngModel)]="form['bloodPressure']" placeholder="120/80" /></label>
          <label><span>Temp (°C)</span><input [(ngModel)]="form['temperature']" placeholder="36.8" /></label>
          <label><span>Pulse</span><input [(ngModel)]="form['pulse']" placeholder="78" /></label>
          <label><span>Weight</span><input [(ngModel)]="form['weight']" placeholder="12 kg" /></label>
          <label><span>SpO2</span><input type="number" min="0" max="100" [(ngModel)]="form['spo2']" placeholder="98" /></label>
          <label><span>Pain (0-10)</span><input type="number" min="0" max="10" [(ngModel)]="form['painScore']" /></label>
          <label><span>RR</span><input type="number" [(ngModel)]="form['respiratoryRate']" /></label>
          <label><span>Systolic</span><input type="number" [(ngModel)]="form['systolic']" /></label>
          <label><span>Diastolic</span><input type="number" [(ngModel)]="form['diastolic']" /></label>
          <label><span>Glucose</span><input type="number" [(ngModel)]="form['bloodGlucose']" /></label>
        </div>
        <label><span>Notes</span><textarea [(ngModel)]="form['notes']" rows="2"></textarea></label>
      </ng-container>

      <ng-container *ngSwitchCase="'io-chart'">
        <label><span>Patient</span><select [(ngModel)]="form['patientId']" (ngModelChange)="onPatientChange($event)"><option value="">Select patient</option><option *ngFor="let patient of patients" [value]="patient._id">{{ patientLabel(patient) }}</option></select></label>
        <div class="ward-modal__grid">
          <label><span>Direction</span>
            <select [(ngModel)]="form['direction']">
              <option value="INTAKE">Intake</option>
              <option value="OUTPUT">Output</option>
            </select>
          </label>
          <label><span>Category</span>
            <select [(ngModel)]="form['ioCategory']">
              <option value="Oral">Oral</option>
              <option value="IV">IV</option>
              <option value="NG">NG</option>
              <option value="Urine">Urine</option>
              <option value="Drain">Drain</option>
              <option value="Vomiting">Vomiting</option>
              <option value="Other">Other</option>
            </select>
          </label>
          <label><span>Volume (ml)</span><input type="number" [(ngModel)]="form['volumeMl']" /></label>
          <label><span>Shift</span><select [(ngModel)]="form['shift']"><option *ngFor="let shift of shiftOptions" [value]="shift.value">{{ shift.label }}</option></select></label>
        </div>
        <label><span>Notes</span><textarea [(ngModel)]="form['notes']" rows="2"></textarea></label>
      </ng-container>

      <ng-container *ngSwitchCase="'orders-services'">
        <label><span>Patient</span><select [(ngModel)]="form['patientId']"><option value="">Select patient</option><option *ngFor="let patient of patients" [value]="patient._id">{{ patientLabel(patient) }}</option></select></label>
        <label><span>Order Type</span><select [(ngModel)]="form['orderType']"><option value="lab">Lab</option><option value="service">Service</option></select></label>
        <label><span>Order Name</span><input [(ngModel)]="form['orderName']" /></label>
        <label><span>Priority</span><select [(ngModel)]="form['priority']"><option value="normal">Routine</option><option value="urgent">Urgent</option><option value="stat">STAT</option></select></label>
        <label><span>Notes</span><textarea [(ngModel)]="form['notes']" rows="2"></textarea></label>
      </ng-container>

      <ng-container *ngSwitchCase="'shift-handover'">
        <label><span>Patient</span><select [(ngModel)]="form['patientId']"><option value="">Select patient</option><option *ngFor="let patient of patients" [value]="patient._id">{{ patientLabel(patient) }}</option></select></label>
        <label><span>Shift</span><select [(ngModel)]="form['shift']"><option *ngFor="let shift of shiftOptions" [value]="shift.value">{{ shift.label }}</option></select></label>
        <label><span>Nurse Name</span><input [(ngModel)]="form['nurseName']" /></label>
        <label><span>Patient Condition</span><input [(ngModel)]="form['patientCondition']" placeholder="Stable, observation, critical..." /></label>
        <div class="ward-modal__grid">
          <label><span>Pending Items</span><input type="number" [(ngModel)]="form['pendingCount']" /></label>
          <label><span>Doctor Informed</span><select [(ngModel)]="form['doctorInformed']"><option value="no">No</option><option value="yes">Yes</option></select></label>
        </div>
        <label><span>Pending Medicines</span><textarea [(ngModel)]="form['pendingMedicines']" rows="2"></textarea></label>
        <label><span>Pending Labs</span><textarea [(ngModel)]="form['pendingLabs']" rows="2"></textarea></label>
        <label><span>Running Drips</span><textarea [(ngModel)]="form['runningDrips']" rows="2"></textarea></label>
        <label><span>Special Instructions</span><textarea [(ngModel)]="form['specialInstructions']" rows="2"></textarea></label>
        <label><span>Risk Alerts</span><textarea [(ngModel)]="form['riskAlerts']" rows="2"></textarea></label>
        <label><span>Handover Notes</span><textarea [(ngModel)]="form['description']" rows="4"></textarea></label>
      </ng-container>

      <ng-container *ngSwitchCase="'inventory'">
        <label>
          <span>Product</span>
          <select [(ngModel)]="form['productId']">
            <option value="">Select product</option>
            <option *ngFor="let product of products" [value]="product._id">{{ productLabel(product) }}</option>
          </select>
        </label>
        <label>
          <span>From store</span>
          <select [(ngModel)]="form['fromLocationId']">
            <option value="">Select store</option>
            <option *ngFor="let store of stores" [value]="store._id">{{ store.name }}</option>
          </select>
        </label>
        <label>
          <span>Ward</span>
          <select [(ngModel)]="form['wardId']">
            <option value="">Select ward</option>
            <option *ngFor="let ward of wards" [value]="ward._id">{{ ward.name }}</option>
          </select>
        </label>
        <label><span>Quantity</span><input type="number" min="1" [(ngModel)]="form['quantity']" /></label>
        <label><span>Notes</span><textarea [(ngModel)]="form['description']" rows="2"></textarea></label>
      </ng-container>
    </div>

    <div class="ward-modal__foot">
      <button type="button" class="hms-btn hms-btn--ghost" (click)="close()">Cancel</button>
      <button type="button" class="hms-btn hms-btn--primary" [disabled]="saving || loading" (click)="submit()">
        <i class="fa" [ngClass]="saving ? 'fa-spinner fa-spin' : 'fa-check'"></i>
        {{ saving ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </div>
</div>
